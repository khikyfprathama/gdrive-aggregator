<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#0f0f14"/>

  <!-- Cloud shape (top arc) -->
  <path
    d="M22 34 C22 28 26 24 31 24 C31.5 20.5 34.5 18 38 18 C42.4 18 46 21.6 46 26 C48.2 26.5 50 28.5 50 31 C50 33.8 47.8 36 45 36 H24 C22.9 36 22 35.1 22 34 Z"
    stroke="#3b82f6"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Hard drive icon inside cloud -->
  <rect x="28" y="26" width="8" height="6" rx="1.5" fill="#60a5fa"/>
  <circle cx="34.5" cy="29" r="0.9" fill="#0f0f14"/>
  <line x1="29.5" y1="30.5" x2="31.5" y2="30.5" stroke="#0f0f14" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Center hub node -->
  <circle cx="32" cy="43" r="3" fill="#3b82f6"/>

  <!-- Three connector arms -->
  <line x1="32" y1="40" x2="32" y2="37" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="43" x2="22" y2="50" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="43" x2="42" y2="50" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Bottom-left node -->
  <circle cx="20" cy="51" r="2.5" stroke="#60a5fa" stroke-width="1.8" fill="#0f0f14"/>
  <!-- Bottom-right node -->
  <circle cx="44" cy="51" r="2.5" stroke="#60a5fa" stroke-width="1.8" fill="#0f0f14"/>
</svg>